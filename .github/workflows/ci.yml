name: CI

# 本仓最小门禁（ADR-D29 R2「单仓可自证」）：格式 + 构建 + 静态检查 + 测试（含 race）。
# 本仓**不得** checkout 其他仓 —— 需要别的仓源码才能过，就是边界画错了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest
    # RISK-CI-GATES：DB 腿不再长期 skip。库只装测试 schema（risk），DSN 统一走
    # RISK_TEST_DSN（internal/pgstore/testdsn_test.go）；本地未设置时用例仍显式 skip。
    env:
      RISK_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion_risk_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tellurion_risk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tellurion_risk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: gofmt（未格式化即红）
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请跑 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # X-DEP-BUMP-CONSUMERS：依赖漏洞门（2026-11-12 回补）。
      # 首轮只升了 pin、没加门——依赖升级与漏洞检测拆开，pin 里带已知漏洞也能全绿。
      # govulncheck 按“符号级可达性”判定，只对真正被调用到的漏洞报红。
      # 破坏验证：把 kit / pgx 降回旧 pin ⇒ 本步以 GO-2026-5004 等 ID 报红；还原 ⇒ EXIT=0。
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # RISK-CI-GATES：Test 的 DB 腿依赖 risk schema，先应用本仓迁移。
      # 入口就是服务启动时用的 pgstore.Migrate（= rule.Migrations() 的幂等 DDL，
      # 无版本表）；这里复用已有的迁移重放集成腿，不另造 .sql 镜像、不复制 core 脚本。
      - name: Migrate（pgstore.Migrate）
        run: go test ./internal/pgstore -count=1 -run '^TestMigrationReplay_Integration$' -v

      - name: Test
        run: go test ./... -count=1 -coverprofile=coverage.out

      # RISK-CI-GATES：覆盖率门 = 实测 total 74.6% 取整 74 − 5 = 69。
      # 阈值来源与复测方法见 AGENTS.md §2；调门必须同时改这里与文档。
      - name: Coverage gate（>= 69%）
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')"
          echo "total coverage = ${total}% (gate = 69%)"
          awk -v total="$total" -v gate=69 'BEGIN { if (total+0 < gate+0) { printf "coverage %.1f%% below gate %d%%\n", total, gate; exit 1 } }'

      # race 需要 cgo + gcc（ubuntu-latest 自带）；本机 Windows 无 gcc，只能由 CI 验证。
      - name: Test（-race）
        run: go test -race ./... -count=1

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
