# tellurion-risk · 单仓本地运行（ADR-036 G0）
# 用法：docker compose -f deploy/compose.yaml up --build
# 依赖：本机或容器可达的 PostgreSQL（默认 host.docker.internal:5432）。
name: tellurion-risk

services:
  risk:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tellurion-risk:dev
    command: ["-addr", "0.0.0.0:8089"]
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      RISK_DATABASE_URL: ${RISK_DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/tellurion?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8089"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped