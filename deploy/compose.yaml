# tellurion-risk · 单仓本地运行（ADR-036 G0）
# 用法：docker compose -f deploy/compose.yaml up --build
# 依赖：本机或容器可达的 PostgreSQL（默认 host.docker.internal:5432）。
name: tellurion-risk

services:
  risk:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tellurion-risk:dev
    command: ["-addr", "0.0.0.0:8089"]
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      RISK_DATABASE_URL: ${RISK_DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/tellurion?sslmode=disable}
      # 凭证来源（QT-77）：risk 是**验签方**，只需要共享 JWT_SECRET，不持有
      # 任何 *_TOKEN；签发/轮换口径见 tellurion:docs/SPEC.md 的「服务间凭证」节。
      # **没有默认 secret**：`dev-only-change-me` 这类公开字符串等于让任何人都能
      # 自签 token。缺省留空 ⇒ 有 secret 才全闸；没有 secret 时按下一行的显式声明
      # 决定写面是否开放。
      JWT_SECRET: ${JWT_SECRET:-}
      # 容器必须绑 0.0.0.0，端口已发布到宿主 127.0.0.1 —— 这正是
      # `loopback-published` 的定义。声明后：无 secret ⇒ 第 3 态（写面开放 +
      # 启动 WARN 点名）；有 secret ⇒ 第 1 态（全闸）。不声明 + 非回环 + 无
      # secret ⇒ 启动闸直接拒绝。
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
      # G4：monitor 的 `configured` 判别位是**部署声明**（不是探测）。必须与 core
      # 的 risk_service.events_enabled 保持一致；缺省 false 与 core 出厂值对齐。
      RISK_EVENTS_EXPECTED: ${RISK_EVENTS_EXPECTED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8089/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped